<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abunalar - Resulpanel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 22px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-add {
            flex: 2;
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-servers {
            flex: 1;
            background-color: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 15px;
        }

        .stat-title {
            font-size: 13px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .stat-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .blue-dot { background-color: #58a6ff; }
        .green-dot { background-color: #3fb950; }
        .yellow-dot { background-color: #d29922; }
        .purple-dot { background-color: #a371f7; }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .filter-select {
            width: 100%;
            background-color: transparent;
            color: #8b949e;
            border: none;
            padding: 8px 0;
            margin-bottom: 15px;
            outline: none;
        }

        .config-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #7ee787;
            margin-top: 10px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
        }

        .netlify-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Abunalar</h1>
        </div>
        <div class="subtitle">Abunalaryňyzy dolandyryň</div>

        <div class="top-buttons">
            <button class="btn-add" onclick="addHappConfig()">+ Täze abuna</button>
            <button class="btn-servers">⚙ Serwerler</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title"><span class="dot blue-dot"></span> Jemi abunalar</div>
                <div class="stat-value" id="totalCount">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><span class="dot green-dot"></span> İşjeň</div>
                <div class="stat-value" id="activeCount">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><span class="dot yellow-dot"></span> Möhleti gutarýan</div>
                <div class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><span class="dot purple-dot"></span> Jemi konfigler</div>
                <div class="stat-value">1</div>
            </div>
        </div>

        <select class="filter-select">
            <option>Ähli ýagdaý</option>
        </select>

        <!-- Happ VPN Konfigurationsy -->
        <div class="config-box" id="happConfig">
            vless://Resul_Echo-HappVPN@1.1.1.1:443?type=grpc&security=reality&encryption=none&fp=chrome&sni=google.com&sid=123456#Happ_VPN
        </div>

        <div class="footer">
            <div class="netlify-badge">
                <span>✦ Powered by Netlify</span>
            </div>
        </div>
    </div>

    <script>
        function addHappConfig() {
            const randomId = Math.floor(1000 + Math.random() * 9000);
            const newConfig = `vless://Resul_Echo-HappVPN-${randomId}@1.1.1.1:443?type=grpc&security=reality&encryption=none&fp=chrome&sni=google.com&sid=${randomId}#Happ_VPN_${randomId}`;
            
            document.getElementById('happConfig').innerText = newConfig;
            
            let total = parseInt(document.getElementById('totalCount').innerText);
            let active = parseInt(document.getElementById('activeCount').innerText);
            document.getElementById('totalCount').innerText = total + 1;
            document.getElementById('activeCount').innerText = active + 1;

            alert("Täze Happ VPN kody döredildi!");
        }
    </script>

</body>
</html>
