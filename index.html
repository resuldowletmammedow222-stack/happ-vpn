<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <title>VPN Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        .vpn-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .expired { color: #ef4444; font-weight: bold; }
        .active { color: #22c55e; font-weight: bold; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Meniň VPN Panelim</h2>
    <div id="vpn-list"></div>

    <script>
        // VPN-leriň sanawy (Bir ýa-da birnäçe edip goşup bilersiňiz)
        const vpnData = [
            {
                name: "🇫🇮 Finland VPN",
                expireDate: "2026-11-01T23:59:59", // Möhlet güni we wagty
                link: "vless://ab9b5670-d0f5-4211-9e28-9841a18f6bda@8.6.112.0:443?encryption=none&security=tls&sni=finlandcf.alexvpns.ru&alpn=h2&fp=chrome&type=ws&host=finlandcf.alexvpns.ru&path=%2Fmuhasv&headers=%7B%0A%20%20%22Host%22%3A%20%22finlandcf.alexvpns.ru%22%0A%7D&fragment=2%2C0-1%2Ctlshello%2Cnull&fm=%7B%22tcp%22%3A%5B%7B%22settings%22%3A%7B%22delay%22%3A%220-1%22%2C%22length%22%3A%222%22%2C%22packets%22%3A%22tlshello%22%7D%2C%22type%22%3A%22fragment%22%7D%5D%7D#%F0%9F%87%AB%F0%9F%87%AE%20Finland"
            }
            // Başga VPN-leri hem şu formatda goşup bilersiňiz:
            // { name: "🇺🇸 USA VPN", expireDate: "2026-05-10T00:00:00", link: "vless://..." }
        ];

        const container = document.getElementById("vpn-list");
        const now = new Date().getTime();

        vpnData.forEach((vpn, index) => {
            const expireTime = new Date(vpn.expireDate).getTime();
            const card = document.createElement("div");
            card.className = "vpn-card";

            if (now > expireTime) {
                // Möhleti dolan ýagdaýy (Bloklanan ýaly görkezmek)
                card.innerHTML = `
                    <h3>${vpn.name}</h3>
                    <p class="expired">⚠️ Bu VPN-iň möhleti doldy (${new Date(vpn.expireDate).toLocaleDateString()}) we bloklandy!</p>
                `;
            } else {
                // Hozirçe işleýän ýagdaýy
                card.innerHTML = `
                    <h3>${vpn.name}</h3>
                    <p class="active">Status: İşleýär (Möhleti: ${new Date(vpn.expireDate).toLocaleDateString()})</p>
                    <input type="text" value="${vpn.link}" readonly style="width: 70%; padding: 5px;" id="link-${index}">
                    <button onclick="copyLink('link-${index}')">Kopiroit etmek</button>
                `;
            }
            container.appendChild(card);
        });

        function copyLink(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            document.execCommand("copy");
            alert("VPN kody göçürildi!");
        }
    </script>

</body>
</html>
