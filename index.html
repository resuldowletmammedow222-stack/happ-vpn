<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Panel - Happ VPN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
        
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .card-desc { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #1e293b; color: white; border: 1px solid #334155; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .search-input, .filter-select { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; font-size: 14px; outline: none; width: 100%; }
        
        .key-item { background: #131b2e; border: 1px solid #1e293b; padding: 16px; border-radius: 16px; margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
        .key-header { display: flex; justify-content: space-between; align-items: center; }
        .key-name { font-weight: bold; font-size: 16px; color: white; }
        .key-date { background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.2); }
        
        .key-details { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        
        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .action-btn { background: #1e293b; border: 1px solid #334155; color: #60a5fa; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
        .action-btn.danger { color: #f87171; border-color: rgba(248, 113, 113, 0.2); background: rgba(248, 113, 113, 0.05); }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: cursor; cursor: pointer; position: top 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; position: absolute; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 16px; z-index: 99; }
        .modal-content { background: #131b2e; border: 1px solid #1e293b; width: 100%; max-width: 440px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .form-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
        .form-input { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; outline: none; font-size: 14px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-title">Sub Panel [ Admin ]</div>
        <div class="card-desc">📢 Hoş geldiňiz! Baglanyşyklary we serwerleri sazlamalardan dolandyryň.</div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="alert('Goldaw bölümi')">💬 Goldaw</button>
            <button class="btn btn-secondary" onclick="alert('Kanal bölümi')">💬 Kanal</button>
        </div>
    </div>

    <div class="section-header">
        <h3 id="panelCount">HUB açary (0)</h3>
        <button class="btn btn-primary" style="width: auto; padding: 8px 16px;" onclick="openModal()">+ Döret</button>
    </div>

    <select class="filter-select">
        <option>Ähli açarlar</option>
    </select>

    <input type="text" class="search-input" id="searchInput" placeholder="Açar gözle..." onkeyup="renderKeys()">

    <div id="keyList">
        <div style="text-align: center; color: #64748b; padding: 30px; font-size: 14px;">Açar ýok</div>
    </div>
</div>

<!-- Modal: HUB Açary Döret -->
<div id="subModal" class="modal">
    <div class="modal-content">
        <div style="font-weight: bold; font-size: 18px; margin-bottom: 4px;">HUB açary döret</div>
        
        <div class="form-label">AÇARYŇ ADY</div>
        <input type="text" id="keyName" class="form-input" placeholder="Mysal: Resul">

        <div class="form-label">MÖHLET (GÜN)</div>
        <input type="number" id="keyDays" class="form-input" value="30">

        <div class="form-label">KOD NÄÇE ADAM ÜÇIN (CIHAZ SANY, 0 = ÇÄKSIZ)</div>
        <input type="number" id="keyDevices" class="form-input" value="0">

        <div class="form-label">GB (0 = ÇÄKSIZ)</div>
        <input type="number" id="keyGB" class="form-input" value="0">

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-secondary" onclick="closeModal()">Ýatyr</button>
            <button class="btn btn-primary" onclick="saveKey()">Döret</button>
        </div>
    </div>
</div>

<script>
    function getKeys() {
        return JSON.parse(localStorage.getItem('hub_advanced_keys') || '[]');
    }

    function saveToStorage(keys) {
        localStorage.setItem('hub_advanced_keys', JSON.stringify(keys));
        renderKeys();
    }

    function openModal() { document.getElementById('subModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('subModal').style.display = 'none'; }

    function saveKey() {
        const name = document.getElementById('keyName').value;
        if (!name) return alert('Açaryň adyny giriziň!');

        const keys = getKeys();
        
        // Sene hasaplaýyş (30 gün sonrasy)
        let expDate = new Date();
        expDate.setDate(expDate.getDate() + parseInt(document.getElementById('keyDays').value || 30));
        let formattedDate = ('0' + expDate.getDate()).slice(-2) + '.' + ('0' + (expDate.getMonth()+1)).slice(-2) + '.' + expDate.getFullYear();

        keys.push({
            id: Date.now(),
            name: name,
            devices: document.getElementById('keyDevices').value,
            gb: document.getElementById('keyGB').value,
            date: formattedDate,
            active: true,
            config: "vless://sample-uuid@server-ip:443?security=reality# " + name
        });

        saveToStorage(keys);
        document.getElementById('keyName').value = '';
        closeModal();
    }

    function toggleStatus(id) {
        let keys = getKeys();
        keys = keys.map(k => k.id === id ? {...k, active: !k.active} : k);
        saveToStorage(keys);
    }

    function deleteKey(id) {
        let keys = getKeys();
        keys = keys.filter(k => k.id !== id);
        saveToStorage(keys);
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert('Göçürildi!');
    }

    function renderKeys() {
        const keys = getKeys();
        const search = document.getElementById('searchInput').value.toLowerCase();
        const list = document.getElementById('keyList');
        
        const filtered = keys.filter(k => k.name.toLowerCase().includes(search));
        document.getElementById('panelCount').innerText = `HUB açary (${keys.length})`;

        if (filtered.length === 0) {
            list.innerHTML = '<div style="text-align: center; color: #64748b; padding: 30px; font-size: 14px;">Açar ýok</div>';
            return;
        }

        list.innerHTML = filtered.map(k => `
            <div class="key-item">
                <div class="key-header">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label class="switch">
                            <input type="checkbox" ${k.active ? 'checked' : ''} onchange="toggleStatus(${k.id})">
                            <span class="slider"></span>
                        </label>
                        <span class="key-name">${k.name}</span>
                    </div>
                    <span class="key-date">${k.date}</span>
                </div>
                <div class="key-details">
                    <span>⚡ Happ 🔒</span> • <span>Device 0/${k.devices == 0 ? '∞' : k.devices}</span>
                </div>
                <div class="action-grid">
                    <button class="action-btn" onclick="copyText('${k.config}')">Göçür</button>
                    <button class="action-btn" onclick="copyText('${k.config}')">Happ crypt göçür</button>
                    <button class="action-btn" onclick="alert('Möhlet: ${k.date}')">Möhlet</button>
                    <button class="action-btn" onclick="alert('Cihazlar arassalandy!')">Cihazlary arassala</button>
                    <button class="action-btn danger" onclick="deleteKey(${k.id})">Poz</button>
                </div>
            </div>
        `).join('');
    }

    renderKeys();
</script>

</body>
</html>
